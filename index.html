  <style>
    :root {
      --ink: #150B28;
      --ink-soft: #4C3E68;
      --paper: #EAE1F7;
      --paper-raised: rgba(255, 255, 255, 0.82);
      --line: #C9B6E6;
      --accent: #7B2FF7;
      --accent-deep: #4E17A8;
      --accent-soft: rgba(123, 47, 247, 0.12);
      --cta-a: #FF7A3D;
      --cta-b: #FF3D9A;
      --amber: #A8620F;
      --amber-glow: rgba(168, 98, 15, 0.20);
      --coral: #A32F17;
      --green: #166342;
      --focus: #7B2FF7;
      --radius: 24px;
      --shadow: 0 1px 2px rgba(21, 11, 40, 0.08), 0 8px 24px -16px rgba(21, 11, 40, 0.28);

      --canvas: #EAE1F7;
      --glass-bg: rgba(255, 255, 255, 0.58);
      --glass-bg-strong: rgba(255, 255, 255, 0.76);
      --glass-border: rgba(123, 47, 247, 0.22);
      --glass-shadow: 0 8px 32px -8px rgba(78, 23, 168, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.7);
      --glass-blur: 22px;
      --blob1: #7B2FF7;
      --blob2: #2FCBE0;
      --blob3: #FF3D9A;
      --blob4: #FFB23D;
      color-scheme: light;
    }

    html.dark {
      --ink: #FBF8FF;
      --ink-soft: #C3B4E0;
      --paper: #0A0614;
      --paper-raised: rgba(23, 15, 50, 0.78);
      --line: rgba(255, 255, 255, 0.14);
      --accent: #C79BFA;
      --accent-deep: #9D5FEA;
      --accent-soft: rgba(199, 155, 250, 0.18);
      --amber: #F0B368;
      --amber-glow: rgba(240, 179, 104, 0.20);
      --coral: #F29580;
      --green: #7DDBA6;
      --focus: #C79BFA;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px -16px rgba(0, 0, 0, 0.6);

      --canvas: #0A0614;
      --glass-bg: rgba(24, 16, 44, 0.60);
      --glass-bg-strong: rgba(30, 20, 54, 0.74);
      --glass-border: rgba(255, 255, 255, 0.18);
      --glass-shadow: 0 8px 32px -8px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      --blob1: #8B3FFF;
      --blob2: #1FCEE8;
      --blob3: #FF3DA0;
      --blob4: #FFA83D;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      max-width: 100%;
    }

    html {
      background: var(--canvas);
    }

    body {
      background: transparent;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      transition: color .35s ease;
      position: relative;
    }

    a {
      color: inherit;
    }

    button {
      font-family: inherit;
    }

    ::selection {
      background: var(--accent);
      color: #fff;
    }

    .bg-scene {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      background: var(--canvas);
      transition: background .4s ease;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
    }

    .orb1 {
      width: 52vmax;
      height: 52vmax;
      top: -22vmax;
      left: -20vmax;
      background: radial-gradient(circle at 32% 30%, var(--blob1), transparent 70%);
      filter: blur(6px);
      opacity: .5;
    }

    .orb2 {
      width: 44vmax;
      height: 44vmax;
      bottom: -20vmax;
      right: -16vmax;
      background: radial-gradient(circle at 65% 65%, var(--blob2), transparent 70%);
      filter: blur(6px);
      opacity: .4;
    }

    .orb3 {
      width: 34vmax;
      height: 34vmax;
      top: 38vh;
      left: 58vw;
      background: radial-gradient(circle at 40% 35%, var(--blob3), transparent 70%);
      filter: blur(6px);
      opacity: .35;
    }

    .orb4 {
      width: 26vmax;
      height: 26vmax;
      top: 8vh;
      left: 8vw;
      background: radial-gradient(circle at 45% 40%, var(--blob4), transparent 72%);
      filter: blur(6px);
      opacity: .32;
    }

    html.dark .orb {
      opacity: .28;
    }

    @keyframes float1 {

      0%,
      100% {
        transform: translate(0, 0) scale(1);
      }

      50% {
        transform: translate(5vmax, 7vmax) scale(1.06);
      }
    }

    @keyframes float2 {

      0%,
      100% {
        transform: translate(0, 0) scale(1);
      }

      50% {
        transform: translate(-6vmax, -4vmax) scale(1.08);
      }
    }

    @keyframes float3 {

      0%,
      100% {
        transform: translate(-50%, 0) scale(1);
      }

      50% {
        transform: translate(-50%, 5vmax) scale(.92);
      }
    }

    .app {
      max-width: 760px;
      margin: 0 auto;
      padding: 20px 18px 60px;
      position: relative;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(.94);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes ringPulse {
      0% {
        box-shadow: 0 0 0 0 var(--amber-glow);
      }

      70% {
        box-shadow: 0 0 0 10px rgba(0, 0, 0, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(0, 0, 0, 0);
      }
    }

    @keyframes rippleAnim {
      from {
        transform: scale(0);
        opacity: .5;
      }

      to {
        transform: scale(2.6);
        opacity: 0;
      }
    }



    .glass {
      background: var(--glass-bg);
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(160%);
      backdrop-filter: blur(var(--glass-blur)) saturate(160%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
    }

    .ripple-host {
      position: relative;
      overflow: hidden;
    }

    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      pointer-events: none;
      transform: scale(0);
      animation: rippleAnim .6s ease-out forwards;
      mix-blend-mode: overlay;
    }

    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      margin: 0 0 16px;
      border-radius: 999px;
      position: sticky;
      top: 10px;
      z-index: 20;
    }

    .masthead .brand {
      font-size: 12.5px;
      letter-spacing: .08em;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--ink);
    }

    .masthead .right {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .masthead .stat {
      font-size: 12px;
      color: var(--ink-soft);
      font-weight: 600;
      white-space: nowrap;
    }

    @media (max-width: 430px) {
      .masthead {
        padding: 10px 12px;
      }

      .masthead .right {
        gap: 8px;
      }

      .masthead .stat {
        display: none;
      }

      .auth-user-name {
        max-width: 60px;
      }

      .back-btn {
        font-size: 12px;
      }
    }

    @media (max-width: 360px) {
      .auth-user-name {
        display: none;
      }

      .auth-user-btn {
        padding: 4px 8px 4px 4px;
      }
    }

    .theme-toggle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: var(--glass-bg-strong);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      transition: transform .25s ease, box-shadow .25s;
      flex-shrink: 0;
      box-shadow: var(--shadow);
    }

    .theme-toggle:hover {
      transform: rotate(18deg) scale(1.05);
      box-shadow: 0 0 0 4px var(--accent-soft);
    }

    .theme-toggle:active {
      transform: rotate(90deg) scale(.9);
    }

    .hero-wrap {
      position: relative;
      overflow: hidden;
      padding-top: 14px;
    }

    h1.title {
      font-size: 36px;
      line-height: 1.06;
      margin: 16px 0 4px;
      font-weight: 800;
      letter-spacing: -.02em;
      animation: fadeUp .5s ease both;
    }

    .subtitle {
      color: var(--ink-soft);
      font-size: 14px;
      font-weight: 500;
      margin: 0 0 24px;
      max-width: 56ch;
      line-height: 1.5;
      animation: fadeUp .5s ease .06s both;
    }

    .item-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 15px 17px;
      border-radius: 18px;
      cursor: pointer;
      width: 100%;
      text-align: left;
      color: var(--ink);
      background: var(--glass-bg-strong);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      backdrop-filter: blur(16px) saturate(180%);
      font: inherit;
      position: relative;
      overflow: hidden;
      opacity: 1;
      transition: transform .2s ease, box-shadow .22s ease, border-color .22s ease;
    }

    .item:hover,
    .item:active,
    .item:focus-visible,
    .item.touch-glow {
      opacity: 1 !important;
      transform: translateY(-2px) scale(1.008);
      border-color: rgba(255, 255, 255, 0.45) !important;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.40),
        -4px -4px 14px rgba(0, 235, 255, 0.38),
        4px -4px 15px rgba(255, 0, 128, 0.38),
        4px 4px 16px rgba(255, 170, 40, 0.38),
        -4px 4px 15px rgba(140, 60, 255, 0.40) !important;
      z-index: 5;
    }

    .item:hover .cname,
    .item:active .cname {
      color: var(--ink) !important;
    }

    .item:hover .cmeta,
    .item:active .cmeta {
      color: var(--ink-soft) !important;
    }

    .item:hover .num,
    .item:active .num {
      color: var(--accent) !important;
    }

    .item:hover .arrow,
    .item:active .arrow {
      transform: translateX(4px);
      color: var(--accent) !important;
    }

    .item .num {
      font-weight: 800;
      font-size: 12.5px;
      color: var(--accent);
      width: 24px;
      flex-shrink: 0;
    }

    .item .info {
      flex: 1;
      min-width: 0;
    }

    .item .cname {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -.01em;
      display: block;
    }

    .item .cmeta {
      font-size: 12px;
      color: var(--ink-soft);
      margin-top: 4px;
      font-weight: 500;
      display: block;
    }

    .item .arrow {
      font-size: 18px;
      color: var(--ink-soft);
      flex-shrink: 0;
      transition: transform .18s ease;
    }


    .score-pill {
      font-weight: 800;
      padding: 2px 9px;
      border-radius: 20px;
      font-size: 11px;
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid var(--glass-border);
      margin-left: 8px;
    }

    /* ── MODULE PROGRESS BAR ─────────────────────────────────────── */
    .mod-prog-wrap {
      margin-top: 5px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .mod-prog-track {
      flex: 1;
      height: 4px;
      background: rgba(140, 110, 200, 0.18);
      border-radius: 2px;
      overflow: hidden;
      max-width: 120px;
    }

    html.dark .mod-prog-track {
      background: rgba(255, 255, 255, 0.1);
    }

    .mod-prog-fill {
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--cta-a), var(--cta-b));
      transition: width .4s ease;
    }

    .mod-prog-fill.complete {
      background: linear-gradient(90deg, #166342, #7DDBA6);
    }

    .mod-prog-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--ink-soft);
      white-space: nowrap;
    }

    .mod-prog-label.complete {
      color: var(--green);
    }

    .mode-note {
      font-size: 12px;
      color: var(--ink-soft);
      font-weight: 500;
      margin: 20px 0 0;
      padding: 14px 4px 0;
    }

    .reset-link {
      font-size: 12px;
      color: var(--coral);
      font-weight: 600;
      background: none;
      border: none;
      text-decoration: underline;
      cursor: pointer;
      padding: 0;
    }

    .back-btn {
      font-size: 13px;
      color: var(--ink-soft);
      font-weight: 600;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 0;
      margin-bottom: 0;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: color .15s, transform .15s;
    }

    .back-btn:hover {
      color: var(--accent);
      transform: translateX(-2px);
    }

    .breadcrumb {
      font-size: 12px;
      color: var(--ink-soft);
      font-weight: 600;
      margin: 4px 4px 14px;
    }

    .breadcrumb .sep {
      margin: 0 5px;
      opacity: .5;
    }

    .qmeta-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 12px;
      color: var(--ink-soft);
      font-weight: 600;
      margin-bottom: 2px;
      padding: 0 6px;
    }

    .qmeta-row .chap-tag {
      text-transform: uppercase;
      letter-spacing: .06em;
      font-weight: 800;
      color: var(--accent);
    }

    .score-tag {
      color: var(--ink-soft);
      font-variant-numeric: tabular-nums;
    }

    .qcard {
      border-radius: var(--radius);
      padding: 24px 22px 22px;
      margin-top: 14px;
      animation: fadeUp .35s cubic-bezier(.2, .8, .3, 1) both;
    }

    .qnum-eyebrow {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--cta-a);
      margin-bottom: 10px;
    }

    .qtext {
      font-size: 19px;
      font-weight: 700;
      line-height: 1.4;
      margin: 0 0 20px;
      letter-spacing: -.008em;
    }

    .qtext img,
    .explain img,
    .rexplain img {
      max-width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      margin: 10px 0;
    }

    .qtext p,
    .explain p,
    .rexplain p {
      margin: 0 0 10px;
    }

    .qtext ul,
    .explain ul,
    .rexplain ul,
    .qtext ol,
    .explain ol,
    .rexplain ol {
      margin: 0 0 10px;
      padding-left: 20px;
    }

    .qtext li,
    .explain li,
    .rexplain li {
      margin-bottom: 4px;
    }

    .explain table,
    .rexplain table {
      width: 100%;
      border-collapse: collapse;
      margin: 10px 0;
      font-size: 13px;
    }

    .explain td,
    .explain th,
    .rexplain td,
    .rexplain th {
      border: 1px solid var(--glass-border);
      padding: 6px 8px;
      text-align: left;
    }

    .options {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .opt {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      border-radius: 14px;
      padding: 12px 14px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.4;
      width: 100%;
      text-align: left;
      color: var(--ink);
      background: var(--glass-bg-strong);
      border: 1px solid var(--glass-border);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      backdrop-filter: blur(16px) saturate(180%);
      position: relative;
      overflow: hidden;
      opacity: 1;
      transition: transform .16s ease, box-shadow .22s ease, border-color .2s ease, background .2s ease;
    }

    .opt:hover:not(.locked),
    .opt:active:not(.locked),
    .opt:focus-visible,
    .opt.touch-glow {
      opacity: 1 !important;
      transform: translateY(-1px);
      border-color: rgba(255, 255, 255, 0.45) !important;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.40),
        -4px -4px 14px rgba(0, 235, 255, 0.38),
        4px -4px 15px rgba(255, 0, 128, 0.38),
        4px 4px 16px rgba(255, 170, 40, 0.38),
        -4px 4px 15px rgba(140, 60, 255, 0.40) !important;
      z-index: 5;
    }

    .opt .letter {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1.5px solid var(--ink-soft);
      color: var(--ink-soft);
      font-size: 12px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .opt.correct {
      border-color: var(--green);
      background: rgba(22, 99, 66, 0.14);
    }

    html.dark .opt.correct {
      background: rgba(125, 219, 166, 0.14);
    }

    .opt.correct .letter {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
    }

    .opt.incorrect {
      border-color: var(--coral);
      background: rgba(163, 47, 23, 0.1);
    }

    html.dark .opt.incorrect {
      background: rgba(242, 149, 128, 0.14);
    }

    .opt.incorrect .letter {
      background: var(--coral);
      border-color: var(--coral);
      color: #fff;
    }

    .opt.locked {
      cursor: default;
    }

    .opt.dim {
      opacity: .5;
    }

    .explain {
      margin-top: 16px;
      padding: 15px 16px;
      border-radius: 14px;
      background: var(--accent-soft);
      border: 1px solid var(--glass-border);
      border-left: 3px solid var(--accent);
      font-size: 13.5px;
      font-weight: 500;
      line-height: 1.55;
      color: var(--ink);
      display: none;
    }

    .explain.show {
      display: block;
      animation: fadeUp .3s ease both;
    }

    .explain .exlabel {
      font-weight: 800;
      font-size: 11px;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 6px;
      display: block;
    }

    .explain .no-explain {
      color: var(--ink-soft);
      font-style: italic;
      font-weight: 400;
    }

    .quiz-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 18px;
    }

    .btn {
      font-weight: 700;
      font-size: 14px;
      padding: 12px 24px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      background: linear-gradient(120deg, var(--cta-a), var(--cta-b));
      color: #fff;
      transition: transform .12s, box-shadow .18s, filter .18s;

      }

    .loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      z-index: 5;
    }

    .loading-card {
      padding: 40px 34px;
      border-radius: 26px;
      max-width: 340px;
      width: 100%;
      background: var(--glass-bg-strong);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      position: relative;
      overflow: hidden;
    }

    .loading-card::before {
      content: '';
      position: absolute;
      top: -60%;
      left: -60%;
      width: 220%;
      height: 220%;
      background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.10), transparent);
      animation: shimmerSweep 3s infinite;
      pointer-events: none;
    }

    @keyframes shimmerSweep {
      0% {
        transform: translateX(-60%) translateY(-60%) rotate(45deg);
      }

      100% {
        transform: translateX(60%) translateY(60%) rotate(45deg);
      }
    }

    .loading-logo {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -.02em;
      margin-bottom: 6px;
      background: linear-gradient(120deg, var(--cta-a), var(--cta-b));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: logoPulse 2s ease-in-out infinite;
      position: relative;
    }

    @keyframes logoPulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.04);
      }
    }

    .loading-sub {
      font-size: 12.5px;
      color: var(--ink-soft);
      font-weight: 600;
      letter-spacing: .02em;
      margin-bottom: 26px;
      position: relative;
    }

    .loading-text {
      font-size: 14.5px;
      color: var(--ink);
      font-weight: 600;
      position: relative;
    }

    .loading-dots::after {
      content: '';
      animation: dotCycle 1.4s infinite;
    }

    @keyframes dotCycle {

      0%,
      20% {
        content: '';
      }

      40% {
        content: '.';
      }

      60% {
        content: '..';
      }

      80%,
      100% {
        content: '...';
      }
    }

    .loading-spinner {
      width: 38px;
      height: 38px;
      margin: 22px auto 0;
      border-radius: 50%;
      position: relative;
      border: 3px solid var(--glass-border);
      border-top-color: var(--accent);
      animation: spinRing 0.9s linear infinite;
    }

    @keyframes spinRing {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion:reduce) {
      .loading-card::before {
        animation: none;
      }

      .loading-logo {
        animation: none;
      }

      .loading-spinner {
        animation: spinRing 1.6s linear infinite;
      }
    }

          0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
        ];
        ascii += '\x80';
        while (ascii[lengthProperty] % 64 - 56) ascii += '\x00';
        for (i = 0; i < ascii[lengthProperty]; i++) {
          j = ascii.charCodeAt(i);
          words[i >> 2] |= j << ((3 - i) % 4) * 8;
        }
        words[words[lengthProperty]] = ((asciiBitLength / maxWord) | 0);
        words[words[lengthProperty]] = (asciiBitLength);
        for (j = 0; j < words[lengthProperty];) {
          var w = words.slice(j, j += 16);
          var oldHash = hash;
          hash = hash.slice(0, 8);
          for (i = 0; i < 64; i++) {
            var w15 = w[i - 15], w2 = w[i - 2];
            var a = hash[0], e = hash[4];
            var temp1 = hash[7]
              + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
              + ((e & hash[5]) ^ ((~e) & hash[6]))
              + k[i]
              + (w[i] = (i < 16) ? w[i] : (
                w[i - 16]
                + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
                + w[i - 7]
                + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))
              ) | 0
              );
            var temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
              + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
            hash = [(temp1 + temp2) | 0].concat(hash);
            hash[4] = (hash[4] + temp1) | 0;
          }
          for (i = 0; i < 8; i++) {
            hash[i] = (hash[i] + oldHash[i]) | 0;
          }
        }
        for (i = 0; i < 8; i++) {
          for (j = 3; j + 1; j--) {
            var b = (hash[i] >> (j * 8)) & 255;
            result += ((b < 16) ? 0 : '') + b.toString(16);
          }
        }
        return result;
      }

      function verifyAdminPasskey(input) {
        if (!input) return false;
        var clean = String(input).trim();
        var hash = sha256Hex(clean.toLowerCase());
        var customPassHash = localStorage.getItem('medladder_admin_passkey_hash');
        if (customPassHash && hash === customPassHash) return true;
        var customPass = localStorage.getItem('medladder_admin_passkey');
        if (customPass && clean === customPass.trim()) return true;
        return hash === MASTER_ADMIN_HASH;
      }

      function setAdminPasskey(newKey) {
        if (!newKey || !newKey.trim()) return false;
        try {
          var hash = sha256Hex(newKey.trim().toLowerCase());
          localStorage.setItem('medladder_admin_passkey_hash', hash);
          localStorage.removeItem('medladder_admin_passkey');
          return true;
        } catch (e) {
          return false;
        }
      }

        var list = DEFAULT_ADMIN_EMAILS.slice();
        try {
          var stored = localStorage.getItem('medladder_admin_whitelist');
          if (stored) {
            var parsed = JSON.parse(stored);
            if (Array.isArray(parsed)) {
              parsed.forEach(function (em) {
                var clean = String(em).toLowerCase().trim();
                if (clean && list.indexOf(clean) === -1) list.push(clean);
              });
            }
          }
        } catch (e) { }
        return list;
      }

      function isAdmin(user) {
        if (!user) return false;
        // SECURITY: only trust app_metadata, never user_metadata.
        // user_metadata is editable by the signed-in user themselves via
        // supabaseClient.auth.updateUser({ data: {...} }) — trusting it here
        // meant any logged-in user could grant themselves admin. app_metadata
        // can only be set server-side (Supabase dashboard / service-role
        // script / Edge Function), so it's the only safe signal.
        if (user.app_metadata && (user.app_metadata.role === 'admin' || user.app_metadata.is_admin === true)) return true;
        // The old email-whitelist fallback (localStorage 'medladder_admin_whitelist')
        // is intentionally removed: it's writable from any browser's devtools
        // console (`localStorage.setItem('medladder_admin_whitelist', ...)`),
        // so it granted admin to anyone who tried. app_metadata above is the
        // only path now — set it via the SQL in supabase_rls_policies.sql.
        return false;
      }

      function isUserPro(user) {
        if (!user) return false;

        // 0. ADMIN ACCESS: Automatic Lifetime Full Pro Bypass across all 19 subjects, 739 topics & PYQ bank!
        if (isAdmin(user)) return true;

        // 1. Check authoritative server metadata (Supabase user profile)
        if (user.user_metadata && user.user_metadata.expires_at) {
          var isStillValid = new Date(user.user_metadata.expires_at).getTime() > Date.now();
          try {
            localStorage.setItem('medladder_pro_exp_' + user.id, user.user_metadata.expires_at);
            if (!isStillValid) {
              localStorage.removeItem('medladder_pro_' + user.id);
              localStorage.removeItem('medladder_pro_plan_' + user.id);
            }
          } catch (e) { }
          return isStillValid;
        }

        // 2. Check local client storage cache
        var expStr = localStorage.getItem('medladder_pro_exp_' + user.id);
        if (expStr) {
          if (new Date(expStr).getTime() > Date.now()) return true;
          try {
            localStorage.removeItem('medladder_pro_' + user.id);
            localStorage.removeItem('medladder_pro_plan_' + user.id);
          } catch (e) { }
          return false; // Subscription expired -> Lock again
        }

        // 3. Fallback check (only if no expiration date was ever defined)
        if (user.user_metadata && user.user_metadata.is_premium === true && user.user_metadata.payment_id) {
          var pid = String(user.user_metadata.payment_id);
          if (pid.indexOf('simulated') === -1 && !user.user_metadata.expires_at) {
            return true;
          }
        }

        return false;
      }

      // ─── RAZORPAY ENDPOINT HEALTH CHECK ───────────────────────────────────────
      function checkRazorpayEndpoint() {
        return new Promise(function (resolve) {
          var timeout = setTimeout(function () { resolve({ ok: false, reason: 'timeout' }); }, 6000);
          fetch('https://checkout.razorpay.com/v1/checkout.js', { method: 'HEAD', mode: 'no-cors' })
            .then(function () { clearTimeout(timeout); resolve({ ok: true }); })
            .catch(function (e) { clearTimeout(timeout); resolve({ ok: false, reason: e.message }); });
        });
      }

      // ─── CREATE RAZORPAY ORDER VIA SUPABASE EDGE FUNCTION ────────────────────
      // Edge Function: supabase/functions/razorpay-order/index.ts
      // (See the supabase-setup.sql file for deployment instructions)
      async function createRazorpayOrder(plan) {
        try {
          var session = supabaseClient && supabaseClient.auth ? await supabaseClient.auth.getSession() : null;
          var token = session && session.data && session.data.session ? session.data.session.access_token : null;
          var res = await fetch(PRO_CONFIG.EDGE_ORDER_URL, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': token ? ('Bearer ' + token) : ''
            },
            body: JSON.stringify({
              amount: plan.pricePaise,
              currency: PRO_CONFIG.CURRENCY,
              plan_id: plan.id,
              user_id: currentUser ? currentUser.id : null,
              user_email: currentUser ? currentUser.email : null
            })
          });
          if (!res.ok) throw new Error('Edge Function returned ' + res.status);
          var data = await res.json();
          return data; // { order_id, amount, currency }
        } catch (e) {
          console.warn('createRazorpayOrder edge fn failed (fallback to direct):', e.message);
          return null; // Will fall back to direct payment without order_id
        }
      }

      // ─── VERIFY RAZORPAY PAYMENT VIA SUPABASE EDGE FUNCTION ──────────────────
      // Secret key is stored only in the Edge Function env, NEVER in client code
      async function verifyRazorpayPayment(paymentId, orderId, signature) {
        try {
          var session = supabaseClient && supabaseClient.auth ? await supabaseClient.auth.getSession() : null;
          var token = session && session.data && session.data.session ? session.data.session.access_token : null;
          var res = await fetch(PRO_CONFIG.EDGE_VERIFY_URL, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': token ? ('Bearer ' + token) : ''
            },
            body: JSON.stringify({
              razorpay_payment_id: paymentId,
              razorpay_order_id: orderId || '',
              razorpay_signature: signature || ''
            })
          });
          if (!res.ok) { console.warn('Verify endpoint returned', res.status); return false; }
          var data = await res.json();
          return data && data.verified === true;
        } catch (e) {
          console.warn('verifyRazorpayPayment edge fn failed:', e.message);
          return null; // null = could not verify (treat as soft pass)
        }
      }

      // ─── LOG PAYMENT TO SUPABASE payments TABLE ───────────────────────────────
      async function logPaymentToSupabase(opts) {
        // opts: { paymentId, orderId, signature, plan, amount, status, verifiedOnServer }
        if (!supabaseClient || !currentUser) return;
        try {
          var row = {
            user_id: currentUser.id,
            user_email: currentUser.email || '',
            razorpay_payment_id: opts.paymentId || '',
            razorpay_order_id: opts.orderId || '',
            razorpay_signature: opts.signature || '',
            plan_id: opts.plan ? opts.plan.id : '',
            plan_name: opts.plan ? opts.plan.name : '',
            amount_paise: opts.amount || (opts.plan ? opts.plan.pricePaise : 0),
            currency: PRO_CONFIG.CURRENCY,
            status: opts.status || 'captured',
            verified_on_server: opts.verifiedOnServer === true,
            expires_at: opts.plan ? new Date(Date.now() + opts.plan.days * 86400000).toISOString() : null,
            created_at: new Date().toISOString()
          };
          var { error } = await supabaseClient.from('payments').insert(row);
          if (error) console.warn('logPayment insert error:', error.message);
          else console.log('✅ Payment logged to Supabase payments table:', opts.paymentId);
        } catch (e) {
          console.warn('logPaymentToSupabase error:', e.message);
        }
      }

      // ─── MAIN RAZORPAY CHECKOUT ORCHESTRATOR ──────────────────────────────────
      async function openRazorpayCheckout() {
        if (!currentUser) {
          triggerProAuthRedirect();
          showToast('Please sign in or create an account before completing payment.', 'info');
          return;
        }

        // 1. Load Razorpay SDK if not already present
        if (typeof Razorpay === 'undefined') {
          showToast('Loading Razorpay payment gateway...', 'info');
          await new Promise(function (resolve, reject) {
            var s = document.createElement('script');
            s.src = 'https://checkout.razorpay.com/v1/checkout.js';
            s.onload = resolve;
            s.onerror = reject;
            document.head.appendChild(s);
          });
        }

        var rzpKey = getRazorpayKey();
        if (!rzpKey || rzpKey === 'rzp_test_placeholder') {
          showToast('Razorpay Key not configured. Please contact support.', 'error');
          return;
        }

        // 2. Endpoint health check
        var health = await checkRazorpayEndpoint();
        if (!health.ok) {
          console.warn('Razorpay endpoint unreachable, proceeding anyway:', health.reason);
        }

        var plan = getSelectedPlan();
        var ctaBtn = document.getElementById('proCheckoutBtn');
        if (ctaBtn) { ctaBtn.disabled = true; ctaBtn.innerHTML = '<span>⏳ Preparing checkout...</span>'; }

        // 3. Try to create a Razorpay Order via Edge Function (server-side)
        var orderData = await createRazorpayOrder(plan);
        var orderId = orderData ? orderData.order_id : null;

        if (ctaBtn) {
          ctaBtn.disabled = false;
          ctaBtn.innerHTML = '<span>⚡ Unlock MedLadder Pro (₹' + plan.price + ' · ' + plan.durationLabel + ')</span>';
        }

        // 4. Build Razorpay options
        var options = {
          key: rzpKey,
          amount: plan.pricePaise,
          currency: PRO_CONFIG.CURRENCY,
          name: PRO_CONFIG.PRODUCT_NAME,
          description: 'MedLadder Pro — ' + plan.durationLabel + ' Access (₹' + plan.price + ')',
          image: 'https://medladder.top/icons/icon-192.png',
          order_id: orderId || undefined,
          prefill: {
            name: getUserDisplayName(currentUser),
            email: currentUser.email || '',
            contact: ''
          },
          notes: {
            user_id: currentUser.id,
            plan_id: plan.id,
            plan_name: plan.name
          },
          theme: { color: '#7B2FF7' },
          modal: {
            ondismiss: function () {
              showToast('Payment cancelled.', 'info');
            }
          },
          handler: async function (response) {
            // response: { razorpay_payment_id, razorpay_order_id, razorpay_signature }
            var paymentId  = response.razorpay_payment_id;
            var respOrder  = response.razorpay_order_id || orderId || '';
            var signature  = response.razorpay_signature || '';

            showToast('✅ Payment received! Verifying...', 'info');

            // 5. Server-side signature verification (via Edge Function)
            var verified = await verifyRazorpayPayment(paymentId, respOrder, signature);
            // verified = true (pass) | false (fail) | null (edge fn unreachable)
            // SECURITY: fail CLOSED — Pro is only ever granted when verified === true.
            // A null result (network error, edge fn down, etc.) must NOT be treated
            // as a pass, or anyone can get free Pro just by breaking the connection
            // to the verification endpoint.

            if (verified !== true) {
              var failMsg = (verified === null)
                ? '⚠️ Could not verify your payment right now. Please don\'t retry the charge — contact support with payment ID: ' + paymentId + ' and we\'ll confirm and activate Pro manually.'
                : '⚠️ Payment verification failed. Please contact support with ID: ' + paymentId;
              showToast(failMsg, 'error');
              await logPaymentToSupabase({
                paymentId: paymentId, orderId: respOrder, signature: signature,
                plan: plan, status: (verified === null ? 'verification_unreachable' : 'verification_failed'), verifiedOnServer: false
              });
              return;
            }

            // 6. Log payment to Supabase payments table
            await logPaymentToSupabase({
              paymentId: paymentId, orderId: respOrder, signature: signature,
              plan: plan, status: 'captured', verifiedOnServer: verified === true
            });

            // 7. Activate Pro
            await completeProUpgrade(paymentId, plan);
          }
        };

        // 5. Open Razorpay checkout
        try {
          var rzp = new Razorpay(options);
          rzp.on('payment.failed', async function (resp) {
            var errDesc = resp.error ? resp.error.description : 'Payment failed';
            var errPayId = resp.error ? (resp.error.metadata && resp.error.metadata.payment_id) : '';
            showToast('❌ Payment failed: ' + errDesc, 'error');

      async function completeProUpgrade(paymentId, plan) {
        if (!currentUser) {
          showToast('You must be signed in to activate Pro.', 'error');
          return;
        }
        if (!plan) plan = getSelectedPlan();
        var expiresAt = new Date(Date.now() + plan.days * 24 * 60 * 60 * 1000).toISOString();

        // Cache locally for instant UI response
        localStorage.setItem('medladder_pro_' + currentUser.id, 'true');
        localStorage.setItem('medladder_pro_plan_' + currentUser.id, plan.id);
        localStorage.setItem('medladder_pro_exp_' + currentUser.id, expiresAt);

        // Persist Pro status to Supabase user metadata
        if (supabaseClient && supabaseClient.auth) {
          try {
            await supabaseClient.auth.updateUser({
              data: {
                is_premium: true,
                is_pro: true,
                plan_id: plan.id,
                plan_name: plan.name,
                expires_at: expiresAt,
                payment_id: paymentId,
                upgraded_at: new Date().toISOString()
              }
            });
            console.log('✅ Pro status saved to Supabase user metadata');
          } catch (e) {
            console.warn('Could not save Pro status to Supabase:', e);
          }
        }

        closeProModal();
        updateMastheadAuth();
        showToast('⭐ Congratulations! MedLadder Pro is now ACTIVE. All 739 modules are unlocked!');

        if (state.screen === 'modules' && state.subjectId) {
          renderModuleList(state.subjectId);

          renderSetup(state.subjectId, state.moduleId);

          renderHome();
        }

        // opposite: it only ever looks at whatever REAL currentUser was
        // just returned by Supabase auth (signInWithPassword / verifyOtp),
        // and shows the admin UI only if that real account's app_metadata
        // (set server-side, not editable by the user) says role === 'admin'.
        if (!isAdmin(currentUser)) {
          showToast('Access denied: this account is not authorized as admin. Admin status must be granted server-side.', 'error');
          return false;
        }
        var adminEmail = (currentUser && currentUser.email) || email || '';
        localStorage.setItem('medladder_admin_session', 'true');
        localStorage.setItem('medladder_admin_email', adminEmail);
        renderAdminModalContent();
        updateMastheadAuth();
        if (state.screen === 'home') renderHome();
        showToast('👑 Welcome Admin (' + adminEmail + ')! All paywalls bypassed.');
        return true;
      }

      function getUserDisplayName(user) {
        if (!user) return 'Doctor';
        if (user.user_metadata && user.user_metadata.full_name) return user.user_metadata.full_name;
        if (user.email) {
          var namePart = user.email.split('@')[0];
          return namePart.charAt(0).toUpperCase() + namePart.slice(1);
        }
        return 'Doctor';
      }

      function getUserInitials(user) {
        var name = getUserDisplayName(user);
        if (!name) return 'DR';
        var clean = name.replace(/^dr\.?\s*/i, '').trim();
        if (!clean) clean = name.trim();
        var parts = clean.split(/\s+/);
        if (parts.length >= 2) {
          return (parts[0].charAt(0) + parts[1].charAt(0)).toUpperCase();
        }
        return clean.slice(0, 2).toUpperCase();
      }

      // ── MODULE PROGRESS: Supabase (counts) + localStorage (resume) ──

      // Load all module_progress rows for this user from Supabase
      function loadModuleProgressFromDB(userId) {
        if (!userId || !supabaseClient) return Promise.resolve();
        return supabaseClient
          .from('module_progress')
          .select('module_key,answered_count,correct_count,total_questions')
          .eq('user_id', userId)
          .then(function (res) {
            if (res.error) { console.warn('loadModuleProgress error:', res.error); return; }
            var rows = res.data || [];
            rows.forEach(function (row) {
              progress[row.module_key] = {
                done: row.answered_count || 0,
                correct: row.correct_count || 0,
                total: row.total_questions || 0
              };
            });
          }).catch(function (e) { console.warn('loadModuleProgress catch:', e); });
      }

      // Upsert one row into module_progress (only aggregate counts — no JSONB)
      function saveModuleProgressToDB(moduleKey, answered, correct, total) {
        if (!currentUser || !currentUser.id || !supabaseClient) return;
        supabaseClient.from('module_progress').upsert({
          user_id: currentUser.id,
          module_key: moduleKey,
          answered_count: answered,
          correct_count: correct,
          total_questions: total,
          updated_at: new Date().toISOString()
        }, { onConflict: 'user_id,module_key' }).then(function (res) {
          if (res.error) console.warn('saveModuleProgress error:', res.error);
        }).catch(function (e) { console.warn('saveModuleProgress catch:', e); });
      }

      // Legacy shim — kept to not break any old callers
      function loadUserProgress(userId) {
        if (!userId) return;
        // Also load from localStorage for instant display before DB returns
        try {
          var stored = localStorage.getItem('medladder_progress_' + userId);
          if (stored) {
            var parsed = JSON.parse(stored);
            if (parsed && typeof parsed === 'object') progress = Object.assign({}, parsed);
          }
        } catch (e) { }
        // Then overlay with server data (async)
        loadModuleProgressFromDB(userId).then(function () {
          // Re-render current screen to show updated progress pills
          if (state.screen === 'home') renderHome();
          else if (state.screen === 'modules') renderModuleList(state.subjectId);
        });
      }

      function persistProgress() {
        if (currentUser && currentUser.id) {
          try { localStorage.setItem('medladder_progress_' + currentUser.id, JSON.stringify(progress)); } catch (e) { }
        }
      }

      function showToast(msg, type) {
        var container = document.getElementById('toastContainer');
        if (!container) {
          container = document.createElement('div');
          container.id = 'toastContainer';
          container.className = 'toast-container';
          document.body.appendChild(container);
        }
        var toast = document.createElement('div');
        toast.className = 'toast-item';
        var icon = type === 'error' ? '⚠️' : '✓';
        toast.innerHTML = '<span style="font-size:14px;">' + icon + '</span><span>' + esc(msg) + '</span>';
        container.appendChild(toast);
        setTimeout(function () {
          if (toast && toast.parentNode) toast.parentNode.removeChild(toast);
        }, 3200);
      }

      function switchAuthTab(tab) {
        clearAuthAlerts();
        var titleEl = document.getElementById('authModalTitle');
        var subEl = document.getElementById('authModalSub');
        var tabIn = document.getElementById('tabSignIn');
        var tabUp = document.getElementById('tabSignUp');
        var tabFg = document.getElementById('tabForgot');
        var formIn = document.getElementById('authSignInForm');
        var formUp = document.getElementById('authSignUpForm');
        var formFg = document.getElementById('authForgotForm');

        tabIn.classList.toggle('active', tab === 'signin');
        tabUp.classList.toggle('active', tab === 'signup');
        tabFg.classList.toggle('active', tab === 'forgot');

        formIn.classList.toggle('hidden', tab !== 'signin');
        formUp.classList.toggle('hidden', tab !== 'signup');
        formFg.classList.toggle('hidden', tab !== 'forgot');

        if (tab === 'signin') {
          titleEl.textContent = 'Sign In';
          subEl.textContent = 'Access your test history and sync progress across devices.';
          var emailIn = document.getElementById('authSignInEmail');
          if (emailIn) setTimeout(function () { emailIn.focus(); }, 80);
        } else if (tab === 'signup') {
          titleEl.textContent = 'Create Account';
          subEl.textContent = 'Register to track quiz performance and preserve test scores.';
          var nameIn = document.getElementById('authSignUpName');
          if (nameIn) setTimeout(function () { nameIn.focus(); }, 80);
        } else if (tab === 'forgot') {
          titleEl.textContent = 'Reset Password';
          subEl.textContent = 'Enter your registered email to receive a password recovery link.';
          var fgEmail = document.getElementById('authForgotEmail');
          if (fgEmail) setTimeout(function () { fgEmail.focus(); }, 80);
        }
      }

      function openAuthModal(tab, options) {
        ensureAuthModalDOMElements();
        clearAuthAlerts();
        switchAuthTab(tab || 'signin');

      function initAuth() {
        ensureAuthModalDOMElements();

        // SECURITY: this used to restore a fully-trusted, fabricated admin
        // `currentUser` on every page load purely because a localStorage
        // flag said so — meaning `localStorage.setItem('medladder_admin_session','true')`
        // typed into any browser's console, then reloading, made that
        // browser an admin forever. The cached 'medladder_saved_user' object
        // was just as forgeable and was also trusted immediately, before any
        // server check. Neither is trusted anymore. currentUser now starts
        // null on every load and is only ever set below, from Supabase's
        // real getSession() response — so admin/Pro checks can't pass until
        // the server has actually confirmed who's signed in. This trades a
        // brief "signed out" flash on reload for closing that hole.
        currentUser = null;

        if (!supabaseClient) return;

        supabaseClient.auth.getSession().then(function (res) {
          if (res && res.data && res.data.session && res.data.session.user) {
            currentUser = res.data.session.user;
            try { localStorage.setItem('medladder_saved_user', JSON.stringify(currentUser)); } catch (e) { }
            if (isAdmin(currentUser)) {
              localStorage.setItem('medladder_admin_session', 'true');
              localStorage.setItem('medladder_admin_email', currentUser.email);
            }
            loadUserProgress(currentUser.id);
            updateMastheadAuth();
            updateProModalUI();
          }
          // else: no real Supabase session — stay signed out. (Previously
          // fabricated an admin-device-owner user here from a localStorage
          // flag alone; removed for the same reason as above.)
        }).catch(function (err) {
          console.warn('Session check error:', err);
        });

        supabaseClient.auth.onAuthStateChange(function (event, session) {
          var prevUser = currentUser;

          if (event === 'SIGNED_OUT') {
            currentUser = null;
            localStorage.removeItem('medladder_admin_session');
            localStorage.removeItem('medladder_admin_email');
            localStorage.removeItem('medladder_saved_user');
            updateMastheadAuth();
            updateProModalUI();
            showToast('You have signed out.');
            if (state.screen === 'home') renderHome();
            return;
          }

          if (session && session.user) {
            currentUser = session.user;
            try { localStorage.setItem('medladder_saved_user', JSON.stringify(currentUser)); } catch (e) { }
            loadUserProgress(currentUser.id);
            if (isAdmin(currentUser)) {
              localStorage.setItem('medladder_admin_session', 'true');
              localStorage.setItem('medladder_admin_email', currentUser.email);
            }
            updateMastheadAuth();
            updateProModalUI();
            if (event === 'SIGNED_IN' && !prevUser) {
              if (window.location.hash && window.location.hash.includes('access_token')) {
                window.history.replaceState({}, document.title, window.location.pathname);
              }
              closeAuthModal();
              closeAdminModal();
              showToast('Signed in as ' + getUserDisplayName(currentUser));
              if (state.screen === 'home') renderHome();
              else if (state.screen === 'seo') handleSeoRoute();
            }
          } else {
            // session is null/empty — sign out locally too. (Previously kept
            // a fabricated admin-device-owner user, or the forgeable cached
            // 'medladder_saved_user' object, alive here even with no real
            // session; removed for the same reason as above.)
            currentUser = null;
            localStorage.removeItem('medladder_admin_session');
            localStorage.removeItem('medladder_admin_email');
            localStorage.removeItem('medladder_saved_user');
            updateMastheadAuth();
            updateProModalUI();
          }
        });
      }

      function shuffle(arr) {
        var a = arr.slice();
        for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }

      function addRipple(el, evt) {
        var rect = el.getBoundingClientRect();
        var x = (evt.clientX != null ? evt.clientX : rect.width / 2) - rect.left;
        var y = (evt.clientY != null ? evt.clientY : rect.height / 2) - rect.top;
        var size = Math.max(rect.width, rect.height) * 1.4;
        var span = document.createElement('span');
        span.className = 'ripple';
        span.style.width = span.style.height = size + 'px';
        span.style.left = (x - size / 2) + 'px';
        span.style.top = (y - size / 2) + 'px';
        if (!el.classList.contains('ripple-host')) el.classList.add('ripple-host');
        el.appendChild(span);
        setTimeout(function () { span.remove(); }, 650);
      }
      function wireRipples(selector) {
        document.querySelectorAll(selector).forEach(function (el) {
          el.addEventListener('pointerdown', function (evt) {
            addRipple(el, evt);
            el.classList.add('touch-glow');
          });
          el.addEventListener('pointerup', function () {
            setTimeout(function () { el.classList.remove('touch-glow'); }, 500);
          });
          el.addEventListener('pointerleave', function () {
            el.classList.remove('touch-glow');
          });
          el.addEventListener('pointercancel', function () {
            el.classList.remove('touch-glow');
          });
        });
      }

      // ---------- PYQ SETUP: configure and launch a PYQ quiz ----------
      function renderPYQSetup(examId) {
        clearTimer();

        // Auth gate first
        if (!currentUser) {
          openAuthModal('signin', {
            reason: 'Please sign in or create an account to access the Previous Year Questions bank.',
            onSuccess: function () { renderPYQSetup(examId); }
          });
          return;
        }

        // Pro gate
        if (!isUserPro(currentUser)) {
          openProModal('pyq_bank', { examId: examId });
          return;
        }

        var exam = PYQ_EXAMS.find(function (e) { return e.id === examId; }) || { id: examId, icon: '📝', name: examId, label: examId, years: ['All Years'] };

        state.screen = 'setup';
        state.isPyqMode = true;
        state.pyqExam = examId;
        state.subjectId = null;
        state.moduleId = 'pyq_' + examId;

        var yearsList = exam.years || ['All Years'];
        if (!setupChoice.pyqYear || yearsList.indexOf(setupChoice.pyqYear) === -1) {
          setupChoice.pyqYear = yearsList[0];
        }

        var yearsHtml = yearsList.map(function (y) {
          var activeCls = (setupChoice.pyqYear === y) ? 'active' : '';
          return '<button class="pyq-year-pill ' + activeCls + '" data-year="' + esc(y) + '">' + esc(y) + '</button>';
        }).join('');

        // PYQ Bank: Every year PYQ acts as a dedicated single test covering the full paper
        setupChoice.count = 'all';

        // Exam Timers: 120 min (2 Hours) for INICET, 180 min (3 Hours) for NEET PG & FMGE
        var PYQ_TIME_OPTIONS = [
          { label: '120 min (2 Hours)', value: 7200, hint: 'INICET Standard' },
          { label: '180 min (3 Hours)', value: 10800, hint: 'NEET PG / FMGE Standard' },
          { label: 'Untimed / Practice', value: 0, hint: 'Self-paced study' }

        app.innerHTML =

          '<div class="setup-chapname">' + esc(exam.icon + ' ' + exam.name) + ' Official Exam Papers</div>' +
          '<p class="setup-sub">' + esc(exam.label) + ' · Each year acts as a complete, single full-length official test.</p>' +
          '<div class="setup-section pyq-year-section">' +
          '<div class="setup-label">Select Exam Year / Session (Single Official Test)</div>' +

          '<div class="setup-label">Test Format</div>' +

          '<div class="pyq-single-test-badge-row">' +
          '<span class="pyq-full-badge">📋 Single Full Test</span>' +
          '<span class="pyq-paper-badge">' + esc(exam.name) + ' · ' + esc(setupChoice.pyqYear) + '</span>' +
          '</div>' +

          '<button class="pill-choice ' + (setupChoice.orderMode === 'structured' ? 'active' : '') + '" data-order="structured">Paper Sequence (Original Order)</button>' +
