# MedLadder Supabase project configuration.
# Each function verifies the caller itself (auth.getUser for browser calls,
# HMAC signature for the Razorpay webhook), so Supabase's built-in JWT
# verification is disabled.

project_id = "groeibwykzrliphzzruk"

[functions.razorpay-order]
verify_jwt = false

[functions.razorpay-verify]
verify_jwt = false

[functions.razorpay-webhook]
verify_jwt = false

[functions.razorpay-refund-webhook]
verify_jwt = false

[functions.admin-grant-pro]
verify_jwt = false
