name: Android live update (Capgo on R2)

# Ships web-only changes (HTML/CSS/JS/assets) to installed Android apps without a Play Store release.
# Users download it in the background and get it the next time they reopen the app.
# Native changes (new Capacitor plugins, android/ code) still need "Android release build".
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Bundle version (leave empty for auto, e.g. 1.9.1)'
        required: false
      notes:
        description: 'Release notes (optional)'
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Publish live update
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BUNDLE_VERSION: ${{ inputs.version }}
          BUNDLE_NOTES: ${{ inputs.notes }}
        run: |
          if [ -z "$R2_ENDPOINT" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ]; then
            echo "::error::Set R2_ENDPOINT, R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY in repo secrets."; exit 1
          fi
          node tools/publish-live-update.js $BUNDLE_VERSION --notes "$BUNDLE_NOTES"
