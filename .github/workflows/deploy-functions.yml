name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:   # allow manual trigger from GitHub Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set in GitHub repository secrets. Add it at https://github.com/88paradoxx/MedLadder/settings/secrets/actions"
            exit 1
          fi
          PROJECT_REF="${{ secrets.SUPABASE_PROJECT_REF }}"
          PROJECT_REF="${PROJECT_REF:-groeibwykzrliphzzruk}"

          supabase functions deploy razorpay-order          --project-ref "$PROJECT_REF" --use-api --no-verify-jwt
          supabase functions deploy razorpay-verify         --project-ref "$PROJECT_REF" --use-api --no-verify-jwt
          supabase functions deploy razorpay-webhook        --project-ref "$PROJECT_REF" --use-api --no-verify-jwt
          supabase functions deploy razorpay-refund-webhook --project-ref "$PROJECT_REF" --use-api --no-verify-jwt
          supabase functions deploy admin-grant-pro         --project-ref "$PROJECT_REF" --use-api --no-verify-jwt
